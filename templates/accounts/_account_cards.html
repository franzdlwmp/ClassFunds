<div class="card" style="max-width:640px">
  <h2 style="margin:0 0 12px">Profile</h2>
  <form method="post" style="display:flex;flex-direction:column;gap:16px">
    {% csrf_token %}
    <input type="hidden" name="form" value="profile">
    {{ profile_form.non_field_errors }}
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px">
      <label class="field">First name {{ profile_form.first_name }}{{ profile_form.first_name.errors }}</label>
      <label class="field">Last name {{ profile_form.last_name }}{{ profile_form.last_name.errors }}</label>
    </div>
    <label class="field">Email (optional) {{ profile_form.email }}{{ profile_form.email.errors }}</label>
    <label class="field">Username <input class="input" value="{{ request.user.username }}" disabled></label>
    <p class="muted" style="margin:0;font-size:13px">Your login name can't be changed here.</p>
    <div style="display:flex;justify-content:flex-end"><button type="submit" class="btn btn-primary">Save changes</button></div>
  </form>
</div>

<div class="card" style="max-width:640px">
  <h2 style="margin:0 0 12px">Change password</h2>
  <form method="post" style="display:flex;flex-direction:column;gap:16px">
    {% csrf_token %}
    <input type="hidden" name="form" value="password">
    {{ password_form.non_field_errors }}
    <label class="field">Current password {{ password_form.old_password }}{{ password_form.old_password.errors }}</label>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px">
      <label class="field">New password {{ password_form.new_password1 }}{{ password_form.new_password1.errors }}</label>
      <label class="field">Confirm new password {{ password_form.new_password2 }}{{ password_form.new_password2.errors }}</label>
    </div>
    <div class="muted" style="font-size:13px">{{ password_form.new_password1.help_text|safe }}</div>
    <div style="display:flex;justify-content:flex-end"><button type="submit" class="btn btn-primary">Change password</button></div>
  </form>
</div>
