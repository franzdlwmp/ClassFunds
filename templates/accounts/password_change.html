{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change password | ClassFunds</title>
  <script>
    try { var t = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px">
  <div class="card" style="width:440px;max-width:100%;display:flex;flex-direction:column;gap:16px">
    <h1 style="margin:0;font-size:24px">Change your password</h1>
    {% if request.user.must_change_pass %}
      <p class="muted" style="margin:0">For security, set a new password before you continue.</p>
    {% endif %}

    <form method="post" style="display:flex;flex-direction:column;gap:16px">
      {% csrf_token %}
      {{ form.non_field_errors }}
      <label class="field">Current password
        <span class="password-input">
          {{ form.old_password }}
          <button type="button" class="password-toggle" aria-label="Toggle password visibility" aria-controls="{{ form.old_password.id_for_label }}" aria-pressed="false" data-password-toggle hidden><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
        </span>
        {{ form.old_password.errors }}
      </label>
      <label class="field">New password
        <span class="password-input">
          {{ form.new_password1 }}
          <button type="button" class="password-toggle" aria-label="Toggle password visibility" aria-controls="{{ form.new_password1.id_for_label }}" aria-pressed="false" data-password-toggle hidden><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
        </span>
        {{ form.new_password1.errors }}
      </label>
      <span class="muted" style="font-size:13px">{{ form.new_password1.help_text|safe }}</span>
      <label class="field">Confirm new password
        <span class="password-input">
          {{ form.new_password2 }}
          <button type="button" class="password-toggle" aria-label="Toggle password visibility" aria-controls="{{ form.new_password2.id_for_label }}" aria-pressed="false" data-password-toggle hidden><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
        </span>
        {{ form.new_password2.errors }}
      </label>
      <button type="submit" class="btn btn-primary" style="justify-content:center">Save new password</button>
    </form>

    <form method="post" action="{% url 'logout' %}">
      {% csrf_token %}
      <button type="submit" class="btn" style="width:100%;justify-content:center">Log out</button>
    </form>
  </div>
</div>
<script src="{% static 'js/app.js' %}"></script>
</body>
</html>
