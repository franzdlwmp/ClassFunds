{% comment %}Usage: {% include "partials/nav_link.html" with name="students" icon="users" text="Students management" %}
"name" is a URL name from urls.py. Until that URL exists, the link points to "#".{% endcomment %}
{% url name as nav_url %}<a href="{{ nav_url|default:'#' }}" class="nav-link{% if request.resolver_match.url_name == name %} active{% endif %}" aria-label="{{ text }}"><svg class="icon" aria-hidden="true"><use href="#i-{{ icon }}"/></svg><span class="label">{{ text }}</span></a>
