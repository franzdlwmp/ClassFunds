{% if credentials %}
<div class="modal-backdrop open" id="cred-modal" role="dialog" aria-modal="true" aria-labelledby="cred-title">
  <div class="modal">
    <h2 id="cred-title">{{ credentials.title }}</h2>
    <p class="muted" style="margin:0">{{ credentials.note }}</p>
    <div class="modal-summary">
      <div><span class="muted">Treasurer</span><strong>{{ credentials.name }}</strong></div>
      <div><span class="muted">Username</span><strong>{{ credentials.username }}</strong></div>
    </div>
    <div>
      <div class="muted" style="margin-bottom:6px">Temporary password</div>
      <div class="cred-row">
        <code class="cred-pass" id="cred-pass">{{ credentials.password }}</code>
        <button type="button" class="btn" id="cred-copy">Copy</button>
      </div>
    </div>
    <p class="muted" style="margin:0;font-size:13px">This is shown only once. Share it privately. If it gets lost, use Reset password to make a new one.</p>
    <div class="modal-actions"><button type="button" class="btn btn-primary" id="cred-done">Done</button></div>
  </div>
</div>
<script>
(function () {
  var modal = document.getElementById('cred-modal');
  var pass = document.getElementById('cred-pass');
  var copy = document.getElementById('cred-copy');
  document.getElementById('cred-done').addEventListener('click', function () {
    modal.classList.remove('open');
  });
  copy.addEventListener('click', function () {
    var text = pass.textContent.trim();
    function copied() {
      copy.textContent = 'Copied';
      setTimeout(function () { copy.textContent = 'Copy'; }, 2000);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(copied);
    } else {
      var range = document.createRange();
      range.selectNodeContents(pass);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      try { document.execCommand('copy'); copied(); } catch (e) {}
    }
  });
  copy.focus();
})();
</script>
{% endif %}
